version: "3.9"

# ── AQI Data Pipeline ─────────────────────────────────────────────────────────
# Services: postgres | airflow-init | airflow-webserver | airflow-scheduler | streamlit
# Usage:
#   cp .env.example .env          # fill in your values
#   docker-compose up --build -d
#   http://localhost:8080          # Airflow UI  (admin / admin)
#   http://localhost:8501          # Streamlit dashboard
# ──────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Kolkata
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    POSTGRES_HOST: postgres
    # Make project modules importable inside Airflow containers
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./etl:/opt/airflow/etl
    - ./db:/opt/airflow/db
    - ./data:/opt/airflow/data
    - ./run_pipeline.py:/opt/airflow/run_pipeline.py
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - aqi_net

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aqi_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqi_net

  # ── Airflow DB Init ─────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: aqi_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@aqi-project.local
    restart: "no"

  # ── Airflow Webserver ───────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: aqi_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: aqi_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Streamlit Dashboard ─────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aqi_streamlit
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8501:8501"
    command: streamlit run dashboard/Home.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aqi_net
    restart: unless-stopped

  # ── Pipeline Runner (One-Shot Ingestion + ETL) ───────────────────────────────
  pipeline:
    <<: *airflow-common
    container_name: aqi_pipeline_runner
    command: python run_pipeline.py
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_logs:
  airflow_plugins:

networks:
  aqi_net:
    driver: bridge
